name: s10m_tts
out_dir: runs
model:
  preset: s10m
  vocab_size: 8192
  block_size: 512
  dropout: 0.0
  bias: true
  grad_ckpt: false
data:
  dir: data/processed
  sources:
  - tinystories
  mix: natural
train:
  batch_size: 64
  grad_accum: 4
  max_iters: 2290
  stop_iter: null
  lr: 0.001
  min_lr: 0.0001
  warmup_iters: 200
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  grad_clip: 1.0
  eval_interval: 200
  eval_iters: 50
  ckpt_tokens:
  - 100000000.0
  - 300000000.0
  - 1000000000.0
  log_interval: 10
seed: 1337
dtype: bfloat16
compile: true
