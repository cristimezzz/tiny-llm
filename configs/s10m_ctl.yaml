# 组员 B 消融：本机对照（RTX 5060 Laptop 8GB）。
# 与 configs/s10m.yaml 的训练设置完全相同，只改 name；batch 64×4 是本机显存下的写法，
# 有效 batch 仍为 64 × 4 × 512 = 131072 token/步（和正式训练一致）。
# 在 5090 上跑时用 --batch_size 128 --grad_accum 2 覆盖。
name: s10m_ctl
out_dir: runs
model: { preset: s10m, vocab_size: 8192, block_size: 512, dropout: 0.0, bias: true, grad_ckpt: false }
data:
  dir: data/processed
  sources: [smollm, tinystories]
  mix: natural
train:
  batch_size: 64
  grad_accum: 4
  max_iters: 2290             # 3 亿 token
  stop_iter: null
  lr: 1.0e-3
  min_lr: 1.0e-4
  warmup_iters: 200
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  eval_interval: 200
  eval_iters: 50
  ckpt_tokens: [1.0e+8, 3.0e+8, 1.0e+9]
  log_interval: 10
seed: 1337
dtype: bfloat16
compile: true
